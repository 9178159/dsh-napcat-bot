# DeepSeek Harness (dsh) bundle patch
#
# 作用：把本插件挂到 profile 的插件树里。
# DSH 启动时按 bundle 层栈叠加各插件的 patch；本文件会在配置树中插入一行
# `dsh-napcat-bot` 插件条目。插件的具体配置项由 package.json 里的
# `Config` schema 驱动，会在 DSH 设置面板（集成侧边栏）自动生成表单。
#
# 安装方式（任选其一，均无需联网下载任何 npm 包）：
#   方式 A（手动挂载）：把本文件夹放到 profile 的 node_modules 下，
#                       并把下面的 insert 行加进 profile 自己的 cordis.patch.yml。
#   方式 B（CLI 本地链接）：dsh plugin --profile <profile> add link:<本目录绝对路径>
#
# 注意：id 与 name 必须与包名 dsh-napcat-bot 一致。
- insert:
    - id: dsh-napcat-bot
      name: 'dsh-napcat-bot'
